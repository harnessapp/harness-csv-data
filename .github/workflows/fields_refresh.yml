name: Fields Refresh (11am + 6pm Sydney)

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC.
    # Sydney is UTC+11 during daylight savings (AEDT).
    # 11:00 Sydney -> 00:00 UTC
    # 18:00 Sydney -> 07:00 UTC
    - cron: '0 0 * * *'
    - cron: '0 7 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements.txt || true
          pip install pandas requests beautifulsoup4 lxml numpy

      - name: Run scrape_fields only
        run: |
          python scrapers/scrape_fields.py

      - name: Commit and push changes
        run: |
          git config user.name "Harness Bot"
          git config user.email "bot@harnessapp.local"
          git add -A
          git commit -m "🔄 Fields refresh" || echo "No changes to commit"
          git push
