name: Daily Scrape

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *" # 12:30am Sydney during AEDT (UTC+11)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Try to download yesterday's merged_file from artifact
      - name: Download previous merged_file.csv (artifact)
        uses: actions/download-artifact@v4
        with:
          name: merged-file
          path: .
        continue-on-error: true

      # If artifact does not exist (first run), seed from Release
      - name: Seed merged_file.csv from Release (if missing)
        env:
          RELEASE_MERGED_URL: "https://github.com/harnessapp/harness-csv-data/releases/download/seed-merged/merged_file.csv"
        run: |
          set -e

          if [ -f "merged_file.csv" ] && [ -s "merged_file.csv" ]; then
            echo "✅ merged_file.csv already present and non-empty."
            ls -lah merged_file.csv
            exit 0
          fi

          echo "⚠️ merged_file.csv not found. Downloading seed from release..."

          curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "$RELEASE_MERGED_URL" \
            -o merged_file.csv

          # Validate download
          if [ ! -f "merged_file.csv" ] || [ ! -s "merged_file.csv" ]; then
            echo "❌ Seed download failed or file is empty."
            exit 1
          fi

          echo "✅ Seed downloaded successfully:"
          ls -lah merged_file.csv

          echo "Row count:"
          wc -l merged_file.csv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f "scrapers/requirements.txt" ]; then
            pip install -r scrapers/requirements.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            echo "ℹ️ No requirements.txt found; installing core deps only"
          fi
          pip install pandas requests beautifulsoup4 lxml numpy

      - name: Run scrape_fields.py only (debug)
        env:
          BACKUPS_ENABLED: "0"
        run: |
          set -e
          python -u scrapers/scrape_fields.py

      # Save merged_file.csv for tomorrow's run
      - name: Upload merged_file.csv (artifact for next run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-file
          path: merged_file.csv
          retention-days: 7

      - name: Commit and push changes
        run: |
          git config user.name "Harness Bot"
          git config user.email "bot@harnessapp.local"
          git add -A
          git commit -m "🔄 Nightly scrape" || echo "No changes to commit"
          git push
