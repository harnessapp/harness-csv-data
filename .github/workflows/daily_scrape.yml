name: Daily Scrape

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *" # 12:30am Sydney during AEDT (UTC+11)

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1) Try to pull yesterday's merged_file.csv from the previous workflow run
      - name: Download previous merged_file.csv (artifact)
        id: dl_artifact
        uses: actions/download-artifact@v4
        with:
          name: merged-file
          path: .
        continue-on-error: true

      # 2) If artifact was not found, seed from a GitHub Release asset (ONE-TIME)
      - name: Seed merged_file.csv from Release asset (if missing)
        if: always()
        env:
          RELEASE_MERGED_URL: "PASTE_YOUR_RELEASE_ASSET_URL_HERE"
        run: |
          if [ -f "merged_file.csv" ]; then
            echo "✅ merged_file.csv already present (artifact download worked)."
            ls -lah merged_file.csv
            exit 0
          fi

          echo "⚠️ merged_file.csv not present. Seeding from Release..."
          if [ "$RELEASE_MERGED_URL" = "https://github.com/harnessapp/harness-csv-data/releases/download/seed-merged/merged_file.csv" ]; then
            echo "❌ You must paste RELEASE_MERGED_URL in the workflow."
            exit 1
          fi

          curl -L "$RELEASE_MERGED_URL" -o merged_file.csv
          echo "✅ Seed downloaded."
          ls -lah merged_file.csv

      - name: Debug — confirm merged_file.csv present
        run: |
          ls -lah merged_file.csv || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements.txt || true
          pip install pandas requests beautifulsoup4 lxml numpy

      - name: Run scrapers
        env:
          BACKUPS_ENABLED: "0"
          BACKUP_ROOT: "./_backups"
        run: |
          python -u scrapers/run_scrapers.py

      # 3) Save merged_file.csv for the NEXT run
      - name: Upload merged_file.csv (artifact for next run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-file
          path: merged_file.csv
          retention-days: 7

      - name: Commit and push changes
        run: |
          git config user.name "Harness Bot"
          git config user.email "bot@harnessapp.local"
          git add -A
          git commit -m "🔄 Nightly scrape" || echo "No changes to commit"
          git push
