name: Daily Scrape

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *" # 12:30am Sydney during AEDT (UTC+11)

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Try to pull yesterday's merged_file.csv from the previous run
      - name: Download previous merged_file.csv (artifact)
        uses: actions/download-artifact@v4
        with:
          name: merged-file
          path: .
        continue-on-error: true

      - name: Debug — confirm merged_file.csv present
        run: |
          ls -lah merged_file.csv || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements.txt || true
          pip install pandas requests beautifulsoup4 lxml numpy

      - name: Run scrapers
        run: |
          python -u scrapers/run_scrapers.py

      # Save merged_file.csv for the NEXT run (even if later steps fail)
      - name: Upload merged_file.csv (artifact for next run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-file
          path: merged_file.csv
          retention-days: 7

      - name: Commit and push changes
        run: |
          git config user.name "Harness Bot"
          git config user.email "bot@harnessapp.local"
          git add -A
          git commit -m "🔄 Nightly scrape" || echo "No changes to commit"
          git push
