name: Daily Scrape

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Which scraper to run (manual tests). Scheduled runs always use scrape_fields.py for now."
        required: true
        default: "scrape_fields.py"
        type: choice
        options:
          - scrape_fields.py
          - scrape_results.py
          - run_scrapers.py
          - cold_drivers.py
          - colddrivers30.py
          - coldtrainers.py
          - coldtrainers30.py
          - hot_drivers.py
          - hot_trainers.py
          - hotdrivers30.py
          - hottrainers30.py
  schedule:
    - cron: "30 13 * * *" # 12:30am Sydney during AEDT (UTC+11)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ✅ Install GitHub CLI (reliable installation method)
      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh

      # ✅ Restore merged_file.csv from the PREVIOUS successful workflow run (artifact if exists)
      - name: Restore merged_file.csv from previous successful run (artifact if exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "🔎 Looking for previous successful run of this workflow..."
          
          PREV_RUN_ID=$(gh run list \
            --workflow "${{ github.workflow }}" \
            --branch main \
            --limit 20 \
            --json databaseId,conclusion \
            --jq '.[] | select(.conclusion=="success") | .databaseId' | head -n 1)

          if [ -z "$PREV_RUN_ID" ]; then
            echo "ℹ️ No previous successful run found."
            exit 0
          fi

          echo "⬇️ Attempting to download artifact 'merged-file' from run $PREV_RUN_ID"
          gh run download "$PREV_RUN_ID" -n merged-file -D . || true

          if [ -f "merged_file.csv" ] && [ -s "merged_file.csv" ]; then
            echo "✅ Restored merged_file.csv from previous run artifact."
            ls -lah merged_file.csv
          else
            echo "ℹ️ Previous run artifact not found (or empty). Will fall back to Release seed."
          fi

      # ✅ If merged_file.csv still missing, seed from Release
      - name: Seed merged_file.csv from Release (if missing)
        env:
          RELEASE_MERGED_URL: "https://github.com/harnessapp/harness-csv-data/releases/download/seed-merged/merged_file.csv"
        run: |
          set -e

          if [ -f "merged_file.csv" ] && [ -s "merged_file.csv" ]; then
            echo "✅ merged_file.csv already present and non-empty."
            ls -lah merged_file.csv
            exit 0
          fi

          echo "⚠️ merged_file.csv not found. Downloading seed from release..."

          curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "$RELEASE_MERGED_URL" \
            -o merged_file.csv

          if [ ! -f "merged_file.csv" ] || [ ! -s "merged_file.csv" ]; then
            echo "❌ Seed download failed or file is empty. Exiting with failure."
            exit 1
          fi

          echo "✅ Seed downloaded successfully:"
          ls -lah merged_file.csv
          echo "Row count:"
          wc -l merged_file.csv

      # ✅ Debug: Check first few rows of merged_file.csv to ensure it's the expected version
      - name: Check first few rows of merged_file.csv
        run: |
          echo "First few rows of merged_file.csv:"
          head -n 10 merged_file.csv  # This will print the first 10 rows of the file

      # ✅ Debug: Check columns in merged_file.csv to ensure consistency
      - name: Check columns in merged_file.csv
        run: |
          echo "Columns in merged_file.csv:"
          python -c "import pandas as pd; df = pd.read_csv('merged_file.csv'); print(df.columns)"

      # ✅ Debug: Check for missing data in key columns
      - name: Check for missing data in key columns
        run: |
          python -c "import pandas as pd; df = pd.read_csv('merged_file.csv'); print(df[['LeadTime', '1st Quarter', '2nd Quarter', 'Distance', 'Half Distance', 'BellPosition']].isna().sum())"

      # ✅ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ✅ Install dependencies (including pandas, numpy, webdriver-manager, selenium, and beautifulsoup4)
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy selenium webdriver-manager beautifulsoup4  # Ensure pandas is installed here

      # ✅ Run selected scraper (manual) / scrape_fields.py (scheduled)
      - name: Run selected scraper (manual) / scrape_fields.py (scheduled)
        env:
          BACKUPS_ENABLED: "0"
        run: |
          set -e

          if [ "${{ github.event_name }}" = "schedule" ]; then
            SCRIPT="scrape_fields.py"
          else
            SCRIPT="${{ inputs.script }}"
          fi

          echo "✅ Running: scrapers/${SCRIPT}"
          python -u "scrapers/${SCRIPT}"

      # Save merged_file.csv for next run (only if it exists)
      - name: Upload merged_file.csv (artifact for next run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-file
          path: merged_file.csv
          retention-days: 7

      # Commit and push changes if there are any
      - name: Commit and push changes
        run: |
          git config user.name "Harness Bot"
          git config user.email "bot@harnessapp.local"
          git add -A
          git commit -m "🔄 Nightly scrape" || echo "No changes to commit"
          git push
